story:"阿明的爸爸突然過世，帳戶裡有 360 萬存款。後事要辦、帳單要付，阿明和兩個弟弟一起到了銀行。",ask:"如果你是阿明，你會怎麼做？",

story:"大寶的爸爸留下房子和股票。國稅局的稅單來了：250 萬，2 個月內要繳清。大寶和妹妹一時拿不出這筆現金。",ask:"如果你是大寶，你會怎麼做？",

{t:"法拍邊緣",who:"小美",tip:"公證遺囑決定房子歸小美；保險金負責補償阿志、清償房貸，小美才住得安心。",place:"家族會議",icon:"home",src:"改編自 2025–2026 年自由時報、工商時報報導",

o:[

function calcRes(c){const gross=c.a1+c.a2+c.a3+c.a4;const ded=1333+138+(+c.spouse?553:0)+c.kids*56+c.parents*138+c.d1;const net=Math.max(0,gross-ded);
const rate=net<=0?0:net<=5621?10:net<=11242?15:20;const tax=Math.max(0,rate===10?net*.1:rate===15?net*.15-281.05:rate===20?net*.2-843.15:0);
const live=(c.m1+c.m2)*c.months;const parts=[["遺產稅",tax],[`凍結 ${c.months} 個月的房貸＋生活費`,live],["喪葬、後事",c.f],["補償或照顧",c.comp]];
const needs=parts.reduce((a,p)=>a+p[1],0),avail=c.c1+c.ins;return {gross,ded,net,rate,tax,eff:gross>0?tax/gross*100:0,parts,needs,avail,gap:needs-avail};}

${brief?"":`<p class="hint" style="margin-top:8px">凍結中的長輩財產約 ${fmt(r.gross)}：完稅、全體繼承人同意前都動不了。身故保險金一般不計入遺產；如有規避遺產稅情形，可能依實質課稅原則計入。</p>`}`;}
function gaugeText(n){return n>=4?"風險：高":n>=2?"風險：中":"風險：低";}
function gauge(n){return `<svg class="gauge" viewBox="0 0 240 140" role="img" aria-label="${gaugeText(n)}，勾選 ${n} 項"><path d="M20 120A100 100 0 0170 33.4" fill="none" stroke="#9FD3A9" stroke-width="18"/><path d="M73 31.7A100 100 0 01167 31.7" fill="none" stroke="#F2B65A" stroke-width="18"/><path d="M170 33.4A100 100 0 01220 120" fill="none" stroke="#E07A5F" stroke-width="18"/><g class="needle" id="needle" style="transform:rotate(${-90+180*n/8}deg)"><path d="M117 120L120 36l3 84z" fill="#13233F"/></g><circle cx="120" cy="120" r="9" fill="#13233F"/><text x="22" y="138" font-size="12" fill="#4A566E">低</text><text x="210" y="138" font-size="12" fill="#4A566E">高</text></svg><div class="glabel" id="glabel">${gaugeText(n)}（${n} / 8）</div>`;}
function updGauge(n){const nd=document.getElementById("needle");if(nd)nd.style.transform=`rotate(${-90+180*n/8}deg)`;const g=document.getElementById("glabel");if(g)g.textContent=`${gaugeText(n)}（${n} / 8）`;}
render();
</script>
</body>
